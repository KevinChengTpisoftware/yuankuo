<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" width="100%" height="100%" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="ar-b45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#b45309"/></marker><marker id="ar-f59e0b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#f59e0b"/></marker><marker id="ar-ef4444" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#ef4444"/></marker><marker id="ar-10b981" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#10b981"/></marker><marker id="ar-3b82f6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#3b82f6"/></marker><marker id="ar-0f766e" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#0f766e"/></marker><marker id="ar-8b5cf6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#8b5cf6"/></marker><marker id="ar-94a3b8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#94a3b8"/></marker></defs><rect x="0" y="10" width="640" height="120" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/><text x="320" y="86" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">病人答不出願望怎麼辦？</text><line x1="655" y1="70" x2="745" y2="70" stroke="#0f766e" stroke-width="7" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="760" y="10" width="1040" height="120" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><text x="790" y="58.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">病人可由家屬協助，團隊可用圖卡引導。</text><text x="790" y="102.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">圖卡提供大字模式與大圖書本閱讀</text><rect x="0" y="150" width="640" height="120" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/><text x="320" y="226" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">願望不切實際怎麼辦？</text><line x1="655" y1="210" x2="745" y2="210" stroke="#0f766e" stroke-width="7" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="760" y="150" width="1040" height="120" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><text x="790" y="198.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">願望只是起點。治療師把願望拆成</text><text x="790" y="242.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">可達成的短期與長期目標</text><rect x="0" y="290" width="640" height="120" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/><text x="320" y="366" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">資料安全如何確保？</text><line x1="655" y1="350" x2="745" y2="350" stroke="#0f766e" stroke-width="7" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="760" y="290" width="1040" height="120" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><text x="790" y="338.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">展示版只用虛構資料。</text><text x="790" y="382.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">正式上線將使用正式 API、資料庫與登入權限</text><rect x="0" y="430" width="640" height="120" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/><text x="320" y="506" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">AI 會取代治療師嗎？</text><line x1="655" y1="490" x2="745" y2="490" stroke="#0f766e" stroke-width="7" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="760" y="430" width="1040" height="120" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><text x="790" y="478.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">不會。AI 只產生草稿，</text><text x="790" y="522.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">專業人員必須確認</text><rect x="0" y="570" width="640" height="120" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/><text x="320" y="646" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">每個階段的病人都要做計畫嗎？</text><line x1="655" y1="630" x2="745" y2="630" stroke="#0f766e" stroke-width="7" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="760" y="570" width="1040" height="120" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><text x="790" y="618.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">不一定。院方可依階段設定：</text><text x="790" y="662.5" font-size="30" font-weight="600" fill="#115e59" text-anchor="start">PAC 與復健病房啟用，一般復健與 OPD 為選用</text></svg>