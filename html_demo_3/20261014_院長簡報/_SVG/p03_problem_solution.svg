980" height="145" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><circle cx="880" cy="472" r="26" fill="#0f766e"/><polyline points="868.3,472.52 877.4,481.88 893.0,462.9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="930" y="488" font-size="36" font-weight="700" fill="#115e59" text-anchor="start">每次修訂產生新版本，並留下原因與操作者</text><rect x="0" y="565" width="640" height="145" rx="20" fill="#fef2f2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/><text x="320" y="653" font-size="34" font-weight="700" fill="#b91c1c" text-anchor="middle">病人不知道自己進步多少</text><line x1="665" y1="637" x2="795" y2="637" stroke="#0f766e" stroke-width="9" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="820" y="565" width="980" height="145" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><circle cx="880" cy="637" r="26" fill="#0f766e"/><polyline points="868.3,637.52 877.4,646.88 893.0,627.9" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="930" y="653" font-size="36" font-weight="700" fill="#115e59" text-anchor="start">生活功能護照顯示 150 項任務的解鎖進度</text></svg>