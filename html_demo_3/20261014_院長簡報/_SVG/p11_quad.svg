xt-anchor="start">重要且急迫</text><text x="1154" y="108" font-size="26" font-weight="500" fill="#475569" text-anchor="start">暫定：短期優先</text><rect x="1154" y="140" width="300" height="48" rx="24" fill="#fff" stroke="#ef4444" stroke-width="2.5"/><text x="1304" y="173" font-size="26" font-weight="700" fill="#b91c1c" text-anchor="middle">黃金左手/右手 ★</text><rect x="1474" y="140" width="300" height="48" rx="24" fill="#fff" stroke="#ef4444" stroke-width="2.5"/><text x="1624" y="173" font-size="26" font-weight="700" fill="#b91c1c" text-anchor="middle">吸管神射手 ★</text><rect x="450" y="285" width="670" height="265" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/><text x="474" y="337" font-size="46" font-weight="800" fill="#94a3b8" text-anchor="start">Q4</text><text x="560" y="337" font-size="36" font-weight="800" fill="#334155" text-anchor="start">不重要不急迫</text><text x="474" y="383" font-size="26" font-weight="500" fill="#475569" text-anchor="start">暫定：暫緩，定期再評估</text><rect x="1130" y="285" width="670" height="265" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="1154" y="337" font-size="46" font-weight="800" fill="#10b981" text-anchor="start">Q2</text><text x="1240" y="337" font-size="36" font-weight="800" fill="#047857" text-anchor="start">重要不急迫</text><text x="1154" y="383" font-size="26" font-weight="500" fill="#475569" text-anchor="start">暫定：長期目標</text><rect x="1154" y="415" width="300" height="48" rx="24" fill="#fff" stroke="#10b981" stroke-width="2.5"/><text x="1304" y="448" font-size="26" font-weight="700" fill="#047857" text-anchor="middle">完美湯料理 ★</text><text x="1125" y="590" font-size="30" font-weight="700" fill="#475569" text-anchor="middle">重要性　低　→　高</text><text x="428" y="280" font-size="30" font-weight="700" fill="#475569" text-anchor="middle" transform="rotate(-90 428 280)">急迫性　低　→　高</text><rect x="450" y="640" width="1350" height="60" rx="30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/><text x="1125" y="681" font-size="32" font-weight="7