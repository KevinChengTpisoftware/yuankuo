<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" width="100%" height="100%" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/></filter><marker id="ar-b45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#b45309"/></marker><marker id="ar-f59e0b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#f59e0b"/></marker><marker id="ar-ef4444" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#ef4444"/></marker><marker id="ar-10b981" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#10b981"/></marker><marker id="ar-3b82f6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#3b82f6"/></marker><marker id="ar-0f766e" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#0f766e"/></marker><marker id="ar-8b5cf6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#8b5cf6"/></marker><marker id="ar-94a3b8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#94a3b8"/></marker></defs><rect x="0" y="70" width="520" height="420" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/><circle cx="260" cy="160" r="60" fill="#3b82f6"/><text x="260" y="182" font-size="64" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="260" y="300" font-size="50" font-weight="800" fill="#1d4ed8" text-anchor="middle">資訊整合</text><text x="260" y="366" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">整合不同職種的評估結果、</text><text x="260" y="410" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">復健目標與照護資訊，</text><text x="260" y="454" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">建立一致的數位化呈現方式</text><line x1="535" y1="280" x2="625" y2="280" stroke="#0f766e" stroke-width="8" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="640" y="70" width="520" height="420" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/><circle cx="900" cy="160" r="60" fill="#0f766e"/><text x="900" y="182" font-size="64" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="900" y="300" font-size="50" font-weight="800" fill="#115e59" text-anchor="middle">跨專業協作</text><text x="900" y="366" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">以病人生活需求為核心，</text><text x="900" y="410" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">促進團隊共同掌握</text><text x="900" y="454" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">照護目標與復健進度。</text><line x1="1175" y1="280" x2="1265" y2="280" stroke="#0f766e" stroke-width="8" stroke-linecap="round" marker-end="url(#ar-0f766e)"/><rect x="1280" y="70" width="520" height="420" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/><circle cx="1540" cy="160" r="60" fill="#10b981"/><text x="1540" y="182" font-size="64" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1540" y="300" font-size="50" font-weight="800" fill="#047857" text-anchor="middle">個別化照護</text><text x="1540" y="366" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">依據個案功能狀態與生活目標，</text><text x="1540" y="410" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">制定及調整復健計畫，</text><text x="1540" y="454" font-size="30" font-weight="500" fill="#475569" text-anchor="middle">支持功能恢復與返家準備。</text><rect x="0" y="560" width="1800" height="120" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/><text x="900" y="640" font-size="46" font-weight="800" fill="#b45309" text-anchor="middle">從分散紀錄到數位整合，讓跨專業團隊共享資訊、協同照護。</text></svg>